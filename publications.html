<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications — IAI-USTC Quantum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #04060e;
            --surface: rgba(10, 16, 36, 0.55);
            --surface-hover: rgba(16, 24, 52, 0.65);
            --surface-solid: #0a1024;
            --surface-2: #101830;
            --border: rgba(0, 229, 255, 0.06);
            --border-hover: rgba(0, 229, 255, 0.14);
            --border-glow: rgba(0, 229, 255, 0.25);
            --text: #e4eaf6;
            --text-secondary: #8294b8;
            --text-muted: #4e6080;
            --text-dim: #2e4060;
            --cyan: #00e5ff;
            --cyan-soft: #80f0ff;
            --cyan-dim: rgba(0, 229, 255, 0.07);
            --cyan-glow: rgba(0, 229, 255, 0.3);
            --violet: #a78bfa;
            --violet-dim: rgba(167, 139, 250, 0.06);
            --amber: #fbbf24;
            --amber-dim: rgba(251, 191, 36, 0.08);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            line-height: 1.65; min-height: 100vh; overflow-x: hidden;
        }

        .bg-canvas {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none; opacity: 0.28;
        }

        body::after {
            content: ''; position: fixed; inset: 0; z-index: 1;
            pointer-events: none; opacity: 0.028;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 256px;
        }

        .ambient-orb {
            position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
        }
        .ambient-orb--cyan {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(0,229,255,0.06) 0%, transparent 70%);
            top: -10%; right: -8%;
            animation: orbFloat 22s ease-in-out infinite;
        }
        .ambient-orb--violet {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(139,92,246,0.04) 0%, transparent 70%);
            bottom: 10%; left: -6%;
            animation: orbFloat 28s ease-in-out infinite reverse;
        }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -20px) scale(1.05); }
            66% { transform: translate(-20px, 15px) scale(0.95); }
        }

        /* ─── Nav ─── */
        .top-nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 32px; height: 56px;
            background: rgba(4, 6, 14, 0.72);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(24px) saturate(1.2);
            -webkit-backdrop-filter: blur(24px) saturate(1.2);
        }
        .nav-logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem; font-weight: 500;
            color: var(--text-muted); text-decoration: none;
            letter-spacing: 0.05em; transition: color 0.3s;
        }
        .nav-logo:hover { color: var(--cyan); text-decoration: none; }
        .nav-links { display: flex; align-items: center; gap: 4px; }
        .nav-link {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.76rem; font-weight: 500;
            color: var(--text-muted); text-decoration: none;
            padding: 6px 14px; border-radius: var(--radius-sm);
            border: 1px solid transparent;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.03em;
        }
        .nav-link:hover { color: var(--text); background: var(--surface); border-color: var(--border); text-decoration: none; }
        .nav-link.active { color: var(--cyan); background: var(--cyan-dim); border-color: rgba(0,229,255,0.12); }
        .nav-lang { display: flex; gap: 4px; margin-left: 16px; padding-left: 16px; border-left: 1px solid var(--border); }
        .nav-lang button {
            background: transparent; border: none;
            color: var(--text-dim); padding: 4px 10px;
            border-radius: 4px; cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem; font-weight: 500;
            transition: all 0.25s;
        }
        .nav-lang button:hover { color: var(--text); background: var(--surface); }
        .nav-lang button.active { color: var(--cyan); }

        /* ─── Layout ─── */
        .container {
            position: relative; z-index: 2;
            max-width: 880px; margin: 0 auto;
            padding: 0 32px 80px;
        }

        /* ─── Page Hero ─── */
        .page-hero {
            padding: 110px 0 64px; text-align: center;
            position: relative;
            opacity: 0; animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
        }
        .page-hero::before {
            content: '';
            position: absolute; width: 600px; height: 400px;
            top: 0; left: 50%; transform: translateX(-50%);
            background: radial-gradient(ellipse at 50% 30%, rgba(0,229,255,0.06) 0%, transparent 70%);
            pointer-events: none; z-index: -1;
        }
        .page-hero-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.66rem; color: var(--cyan);
            letter-spacing: 0.16em; text-transform: uppercase;
            margin-bottom: 22px;
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        .page-hero-label::before, .page-hero-label::after {
            content: ''; width: 28px; height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-hover));
        }
        .page-hero-label::after {
            background: linear-gradient(90deg, var(--border-hover), transparent);
        }
        .page-hero h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 800; letter-spacing: -1px;
            margin-bottom: 14px; color: var(--text);
        }
        .page-hero h1 .accent {
            background: linear-gradient(135deg, var(--cyan), var(--cyan-soft));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .page-hero p {
            font-size: 0.95rem; color: var(--text-secondary);
            max-width: 460px; margin: 0 auto;
            opacity: 0; animation: fadeUp 0.6s 0.2s cubic-bezier(0.16,1,0.3,1) forwards;
        }
        .hero-badges {
            display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
            margin-top: 24px;
            opacity: 0; animation: fadeUp 0.6s 0.3s cubic-bezier(0.16,1,0.3,1) forwards;
        }
        .hero-badges img { height: 20px; border-radius: 3px; }

        /* ─── Year group ─── */
        .year-group {
            margin-bottom: 56px;
            opacity: 0; animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
        }
        .year-header {
            display: flex; align-items: center; gap: 16px; margin-bottom: 20px;
        }
        .year-label {
            font-family: 'Syne', sans-serif;
            font-size: 0.78rem; font-weight: 700;
            color: var(--text-dim); letter-spacing: 0.08em; white-space: nowrap;
        }
        .year-line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-hover), transparent); }

        /* ─── Paper card ─── */
        .paper-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 22px 26px;
            margin-bottom: 10px;
            transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
            position: relative; overflow: hidden;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .paper-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0;
            width: 2px; background: var(--cyan);
            opacity: 0; transition: opacity 0.3s;
        }
        .paper-card::after {
            content: ''; position: absolute; inset: -1px; border-radius: inherit; padding: 1px;
            background: linear-gradient(135deg, rgba(0,229,255,0.1), transparent 50%, rgba(139,92,246,0.06));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            opacity: 0; transition: opacity 0.35s; pointer-events: none;
        }
        .paper-card:hover {
            border-color: transparent;
            background: var(--surface-hover);
            transform: translateX(3px);
            box-shadow: 0 8px 28px rgba(0,0,0,0.35);
        }
        .paper-card:hover::before { opacity: 1; }
        .paper-card:hover::after { opacity: 1; }

        .paper-meta {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 10px; flex-wrap: wrap;
        }
        .paper-venue {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem; color: var(--text-dim);
            letter-spacing: 0.02em;
        }
        .paper-title {
            font-family: 'DM Sans', sans-serif;
            font-size: 0.92rem; font-weight: 600;
            color: var(--text); margin-bottom: 10px; line-height: 1.5;
        }
        .paper-authors {
            font-size: 0.8rem; color: var(--text-muted);
            margin-bottom: 14px; line-height: 1.6;
        }
        .paper-authors .team-author { color: var(--cyan); font-weight: 500; }
        .paper-links { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .paper-link {
            display: inline-flex; align-items: center; gap: 5px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem; font-weight: 500;
            padding: 5px 13px; border-radius: var(--radius-sm);
            text-decoration: none; transition: all 0.2s;
        }
        .paper-link.doi {
            background: rgba(0,229,255,0.06); color: var(--cyan);
            border: 1px solid rgba(0,229,255,0.1);
        }
        .paper-link.doi:hover {
            background: rgba(0,229,255,0.12);
            border-color: rgba(0,229,255,0.2);
            text-decoration: none;
        }
        .paper-link.arxiv {
            background: rgba(251,191,36,0.06); color: var(--amber);
            border: 1px solid rgba(251,191,36,0.1);
        }
        .paper-link.arxiv:hover {
            background: rgba(251,191,36,0.12);
            border-color: rgba(251,191,36,0.2);
            text-decoration: none;
        }

        /* ─── Footer ─── */
        footer {
            text-align: center; padding-top: 40px;
            border-top: 1px solid var(--border);
            opacity: 0; animation: fadeUp 0.5s 0.9s cubic-bezier(0.16,1,0.3,1) forwards;
        }
        footer p { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.04em; }
        footer a { color: var(--text-muted); text-decoration: none; transition: color 0.25s; }
        footer a:hover { color: var(--cyan); text-decoration: none; }

        /* ─── Animations ─── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ─── Responsive ─── */
        @media (max-width: 600px) {
            .container { padding: 0 16px 60px; }
            .top-nav { padding: 0 16px; }
            .page-hero { padding: 96px 0 52px; }
            .ambient-orb { display: none; }
        }

        /* ─── Scrollbar ─── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.08); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--cyan-dim); }
        ::selection { background: var(--cyan-dim); color: var(--cyan); }
    </style>
</head>
<body>

    <canvas class="bg-canvas" id="bg"></canvas>

    <div class="ambient-orb ambient-orb--cyan"></div>
    <div class="ambient-orb ambient-orb--violet"></div>

    <nav class="top-nav">
        <a href="index.html" class="nav-logo">IAI-USTC Quantum</a>
        <div class="nav-links">
            <a href="index.html" class="nav-link" data-i18n="nav_home">Home</a>
            <a href="publications.html" class="nav-link active" data-i18n="nav_pub">Publications</a>
            <div class="nav-lang">
                <button id="lang-en" onclick="switchLanguage('en')">EN</button>
                <button id="lang-zh" onclick="switchLanguage('zh')">中文</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <section class="page-hero">
            <p class="page-hero-label" data-i18n="pub_label">§ Research Output</p>
            <h1 data-i18n="pub_title">Publications</h1>
            <div class="hero-badges">
                <img src="https://img.shields.io/badge/Quantum_Computing-AI-00e5ff?style=flat-square" alt="Quantum Computing">
                <a href="https://iai-ustc-quantum.github.io"><img src="https://img.shields.io/badge/Page-iai--ustc--quantum.github.io-4D6AE4?style=flat-square" alt="GitHub Page"></a>
            </div>
        </section>

        <div id="papers-container"></div>

        <footer>
            <p data-i18n="footer">© 2021–2026 IAI-USTC-Quantum · <a href="https://github.com/IAI-USTC-Quantum">GitHub</a></p>
        </footer>
    </div>

    <script src="data/publications.js"></script>
    <script>
        /* ─── Canvas background ─── */
        (function () {
            const canvas = document.getElementById('bg');
            const ctx = canvas.getContext('2d');
            let W, H;
            const nodes = [];
            const MAX_NODES = 20;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }

            function addNode() {
                if (nodes.length >= MAX_NODES) return;
                nodes.push({
                    x: Math.random() * W, y: Math.random() * H,
                    vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25,
                    r: Math.random() * 1.2 + 0.4, life: 0, maxLife: Math.random() * 350 + 180
                });
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                if (Math.random() < 0.06) addNode();
                for (let i = 0; i < nodes.length; i++) {
                    const a = nodes[i];
                    a.x += a.vx; a.y += a.vy; a.life++;
                    if (a.x < -10 || a.x > W + 10 || a.y < -10 || a.y > H + 10 || a.life > a.maxLife) {
                        nodes.splice(i, 1); i--; continue;
                    }
                    for (let j = i + 1; j < nodes.length; j++) {
                        const b = nodes[j];
                        const dx = a.x - b.x, dy = a.y - b.y, dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 140) {
                            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
                            ctx.strokeStyle = `rgba(0, 229, 255, ${0.08 * (1 - dist / 140)})`;
                            ctx.lineWidth = 0.4; ctx.stroke();
                        }
                    }
                    ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 229, 255, ${0.4 * (1 - a.life / a.maxLife)})`; ctx.fill();
                }
                if (Math.random() < 0.002) {
                    const y = Math.random() * H;
                    const grad = ctx.createLinearGradient(0, 0, W, 0);
                    grad.addColorStop(0, 'transparent');
                    grad.addColorStop(0.5, 'rgba(0,229,255,0.02)');
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad; ctx.fillRect(0, y, W, 1);
                }
                requestAnimationFrame(draw);
            }
            resize(); window.addEventListener('resize', resize); draw();
        })();

        /* ─── Render ─── */
        function renderPapers() {
            const byYear = {};
            publications.forEach(p => {
                if (!byYear[p.year]) byYear[p.year] = [];
                byYear[p.year].push(p);
            });

            const container = document.getElementById('papers-container');
            const yearsSorted = Object.keys(byYear).sort((a, b) => b - a);

            container.innerHTML = yearsSorted.map(year => `
                <div class="year-group" style="animation-delay: ${(yearsSorted.indexOf(year) + 1) * 0.05}s">
                    <div class="year-header">
                        <span class="year-label">${year}</span>
                        <div class="year-line"></div>
                    </div>
                    ${byYear[year].map(p => `
                        <div class="paper-card">
                            <div class="paper-meta">
                                <span class="paper-venue">${p.venue}</span>
                            </div>
                            <p class="paper-title">${p.title}</p>
                            <p class="paper-authors">${p.authors.join(', ')}</p>
                            <div class="paper-links">
                                ${p.doi ? `<a href="https://doi.org/${p.doi}" class="paper-link doi" target="_blank" rel="noopener">
                                    <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1 5h8M5 1l4 4-4 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
                                    DOI
                                </a>` : ''}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }

        /* ─── Translations ─── */
        const translations = {
            en: {
                nav_home: "Home",
                nav_pub: "Publications",
                pub_label: "§ Research Output",
                pub_title: "Publications",
                footer: "© 2021–2026 IAI-USTC-Quantum · <a href=\"https://github.com/IAI-USTC-Quantum\">GitHub</a>"
            },
            zh: {
                nav_home: "首页",
                nav_pub: "Publications",
                pub_label: "§ Research Output",
                pub_title: "Publications",
                footer: "© 2021–2026 IAI-USTC-Quantum · <a href=\"https://github.com/IAI-USTC-Quantum\">GitHub</a>"
            }
        };

        function switchLanguage(lang) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.innerHTML = translations[lang][key];
            });
            document.querySelectorAll('.nav-lang button').forEach(btn => btn.classList.remove('active'));
            document.getElementById('lang-' + lang).classList.add('active');
            localStorage.setItem('preferred-lang', lang);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderPapers();
            const savedLang = localStorage.getItem('preferred-lang') || 'zh';
            switchLanguage(savedLang);
        });
    </script>
</body>
</html>
